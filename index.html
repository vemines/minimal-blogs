<!doctype html>
<html lang="vi" data-theme="dark" class="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="apple-touch-icon" href="/icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Minimal Blogs</title>

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;1,400&display=swap"
    rel="stylesheet">

  <!-- Prevent theme flash (FOUC) -->
  <script>
    (function () {
      try {
        const theme = localStorage.getItem('blog_theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', theme);
        if (theme === 'dark') {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body class="antialiased font-sans bg-[#fafafa] dark:bg-[#0c0d0e] text-[#121316] dark:text-[#f0f0f2]">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
