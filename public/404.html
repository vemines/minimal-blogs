<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <title>Minimal Blogs</title>
    <script>
      // Single Page Apps for GitHub Pages
      // Redirects 404 subpath back to index.html with query parameter
      (function() {
        var pathSegmentsToKeep = 1;
        var l = window.location;
        l.replace(
          l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
          encodeURIComponent(l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/') + (l.search ? '&q=' + l.search.slice(1) : '')) +
          l.hash
        );
      })();
    </script>
  </head>
  <body>
  </body>
</html>
